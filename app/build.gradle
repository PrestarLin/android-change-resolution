plugins {
    id "com.android.application"
}

android {
    namespace "com.taowen.androidchangeresolution"
    compileSdk 36

    defaultConfig {
        applicationId "com.taowen.androidchangeresolution"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "0.1.0"
    }

    sourceSets {
        main {
            assets.srcDirs += "$buildDir/generated/qtiAssets"
        }
    }
}

def qtiProbeSource = file("src/main/cpp/qti_display_probe.cpp")
def qtiProbeOutput = layout.buildDirectory.file("generated/qtiAssets/native/arm64-v8a/qti-display-probe")

def ndkClangForHost() {
    def sdkDir = System.getenv("ANDROID_HOME") ?: System.getenv("ANDROID_SDK_ROOT")
    if (sdkDir == null || sdkDir.trim().isEmpty()) return null
    def ndkRoot = file("${sdkDir}/ndk")
    if (!ndkRoot.exists()) return null
    def ndkDir = ndkRoot.listFiles()
            .findAll { it.isDirectory() }
            .sort { a, b -> b.name <=> a.name }
            .first()
    def prebuiltRoot = file("${ndkDir}/toolchains/llvm/prebuilt")
    if (!prebuiltRoot.exists()) return null

    def os = System.getProperty("os.name").toLowerCase(Locale.ROOT)
    def osDir = os.contains("win") ? "windows" : os.contains("mac") ? "darwin" : "linux"
    def arch = System.getProperty("os.arch").toLowerCase(Locale.ROOT)
    def archDir = (arch.contains("aarch64") || arch.contains("arm64")) ? "aarch64" : "x86_64"
    def hostDir = "${osDir}-${archDir}"

    def candidates = prebuiltRoot.listFiles()
            .findAll { it.isDirectory() && it.name == hostDir && new File(it, "bin/aarch64-linux-android26-clang++").exists() }
    if (!candidates) return null
    def clang = new File(candidates.first(), "bin/aarch64-linux-android26-clang++")
    return clang.exists() ? clang : null
}

tasks.register("buildQtiDisplayProbe", Exec) {
    inputs.file(qtiProbeSource)
    outputs.file(qtiProbeOutput)
    onlyIf { ndkClangForHost() != null }

    doFirst {
        def clang = ndkClangForHost()
        if (clang == null) {
            logger.warn("qti-display-probe: no runnable NDK host toolchain (${System.getProperty('os.name')} / ${System.getProperty('os.arch')}); the native probe will not be embedded. Non-root display diagnostics still work.")
            return
        }
        qtiProbeOutput.get().asFile.parentFile.mkdirs()
        commandLine clang.absolutePath,
                "-std=c++17",
                "-Wall",
                "-Wextra",
                "-Werror",
                "-Os",
                "-s",
                "-fPIE",
                "-pie",
                "-static-libstdc++",
                qtiProbeSource.absolutePath,
                "-ldl",
                "-o",
                qtiProbeOutput.get().asFile.absolutePath
    }
}

tasks.matching { it.name.startsWith("merge") && it.name.endsWith("Assets") }.configureEach {
    dependsOn("buildQtiDisplayProbe")
}
